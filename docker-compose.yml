services:
  postgres:
    image: postgres:16
    container_name: prisma_postgres
    restart: always
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prisma_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: